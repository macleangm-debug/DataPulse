# MongoDB Router (mongos) Configuration
# For production sharded cluster

# System log
systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongos.log

# Process management
processManagement:
  fork: false
  timeZoneInfo: /usr/share/zoneinfo

# Network
net:
  port: 27017
  bindIp: 0.0.0.0
  maxIncomingConnections: 65536
  compression:
    compressors: snappy,zstd,zlib

# Security (enable in production)
# security:
#   keyFile: /etc/mongodb/keyfile

# Sharding
sharding:
  configDB: config-rs/config1:27019,config2:27019,config3:27019
