# MongoDB Shard Server Configuration
# For production sharded cluster

# System log
systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod-shard.log
  verbosity: 0
  component:
    accessControl:
      verbosity: 0
    command:
      verbosity: 0

# Storage
storage:
  dbPath: /data/db
  journal:
    enabled: true
    commitIntervalMs: 100
  directoryPerDB: true
  wiredTiger:
    engineConfig:
      cacheSizeGB: 8
      journalCompressor: snappy
      directoryForIndexes: true
    collectionConfig:
      blockCompressor: snappy
    indexConfig:
      prefixCompression: true

# Process management
processManagement:
  fork: false
  timeZoneInfo: /usr/share/zoneinfo

# Network
net:
  port: 27018
  bindIp: 0.0.0.0
  maxIncomingConnections: 65536
  wireObjectCheck: true
  compression:
    compressors: snappy,zstd,zlib

# Security (enable in production)
# security:
#   authorization: enabled
#   keyFile: /etc/mongodb/keyfile

# Operation profiling
operationProfiling:
  mode: slowOp
  slowOpThresholdMs: 100

# Replication
replication:
  replSetName: shard1-rs
  oplogSizeMB: 10240

# Sharding
sharding:
  clusterRole: shardsvr
