# MongoDB Config Server Configuration
# For production sharded cluster

# System log
systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod-config.log

# Storage
storage:
  dbPath: /data/configdb
  journal:
    enabled: true
  wiredTiger:
    engineConfig:
      cacheSizeGB: 2

# Process management
processManagement:
  fork: false
  timeZoneInfo: /usr/share/zoneinfo

# Network
net:
  port: 27019
  bindIp: 0.0.0.0
  maxIncomingConnections: 1000

# Security (enable in production)
# security:
#   authorization: enabled
#   keyFile: /etc/mongodb/keyfile

# Replication
replication:
  replSetName: config-rs

# Sharding
sharding:
  clusterRole: configsvr
