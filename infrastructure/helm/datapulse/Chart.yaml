apiVersion: v2
name: datapulse
description: DataPulse - Enterprise Data Collection Platform
type: application
version: 1.0.0
appVersion: "1.0.0"

keywords:
  - data-collection
  - surveys
  - analytics
  - fastapi
  - react

home: https://datapulse.io
sources:
  - https://github.com/datapulse/datapulse

maintainers:
  - name: DataPulse Team
    email: devops@datapulse.io

dependencies:
  - name: redis
    version: "17.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: mongodb
    version: "13.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: mongodb.enabled

annotations:
  category: Analytics
