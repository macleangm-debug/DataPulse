# DataPulse Docker Compose - Production-like Local Testing
# Run: docker-compose -f docker-compose.prod.yml up -d --scale backend=5

version: '3.8'

services:
  # ============================================================================
  # LOAD BALANCER
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: datapulse-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - datapulse-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ============================================================================
  # FRONTEND
  # ============================================================================
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile.prod
    image: datapulse/frontend:latest
    environment:
      - REACT_APP_BACKEND_URL=http://nginx/api
    networks:
      - datapulse-network
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '1'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ============================================================================
  # BACKEND (SCALABLE)
  # ============================================================================
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile.prod
    image: datapulse/backend:latest
    environment:
      - MONGO_URL=mongodb://mongodb-primary:27017,mongodb-secondary1:27017,mongodb-secondary2:27017/datapulse?replicaSet=rs0
      - DB_NAME=datapulse
      - REDIS_URL=redis://redis-master:6379/0
      - CORS_ORIGINS=*
      - EMERGENT_LLM_KEY=${EMERGENT_LLM_KEY}
    depends_on:
      - mongodb-primary
      - redis-master
    networks:
      - datapulse-network
    deploy:
      replicas: 5
      resources:
        limits:
          cpus: '2'
          memory: 4G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ============================================================================
  # MONGODB REPLICA SET
  # ============================================================================
  mongodb-primary:
    image: mongo:7
    container_name: mongodb-primary
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb-primary-data:/data/db
      - ./mongodb/init-replica.js:/docker-entrypoint-initdb.d/init-replica.js:ro
    networks:
      - datapulse-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongodb-secondary1:
    image: mongo:7
    container_name: mongodb-secondary1
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongodb-secondary1-data:/data/db
    networks:
      - datapulse-network
    depends_on:
      - mongodb-primary
    restart: unless-stopped

  mongodb-secondary2:
    image: mongo:7
    container_name: mongodb-secondary2
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongodb-secondary2-data:/data/db
    networks:
      - datapulse-network
    depends_on:
      - mongodb-primary
    restart: unless-stopped

  # ============================================================================
  # REDIS (MASTER-REPLICA)
  # ============================================================================
  redis-master:
    image: redis:7-alpine
    container_name: redis-master
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-master-data:/data
    networks:
      - datapulse-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis-replica1:
    image: redis:7-alpine
    container_name: redis-replica1
    command: redis-server --replicaof redis-master 6379 --appendonly yes
    volumes:
      - redis-replica1-data:/data
    networks:
      - datapulse-network
    depends_on:
      - redis-master
    restart: unless-stopped

  redis-replica2:
    image: redis:7-alpine
    container_name: redis-replica2
    command: redis-server --replicaof redis-master 6379 --appendonly yes
    volumes:
      - redis-replica2-data:/data
    networks:
      - datapulse-network
    depends_on:
      - redis-master
    restart: unless-stopped

  # ============================================================================
  # MONITORING (OPTIONAL)
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - datapulse-network
    profiles:
      - monitoring
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - datapulse-network
    profiles:
      - monitoring
    depends_on:
      - prometheus
    restart: unless-stopped

# ============================================================================
# NETWORKS
# ============================================================================
networks:
  datapulse-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16

# ============================================================================
# VOLUMES
# ============================================================================
volumes:
  mongodb-primary-data:
  mongodb-secondary1-data:
  mongodb-secondary2-data:
  redis-master-data:
  redis-replica1-data:
  redis-replica2-data:
  prometheus-data:
  grafana-data:
