# DataPulse Secrets - Sensitive Configuration
# NOTE: In production, use external secret management (AWS Secrets Manager, Vault, etc.)
# These are base64 encoded placeholders - replace with actual values

apiVersion: v1
kind: Secret
metadata:
  name: datapulse-secrets
  namespace: datapulse
  labels:
    app: datapulse
type: Opaque
stringData:
  # MongoDB Connection String (for sharded cluster)
  # Format: mongodb://user:pass@mongos1:27017,mongos2:27017,mongos3:27017/datapulse?authSource=admin&replicaSet=rs0
  MONGO_URL: "mongodb://datapulse_user:CHANGE_ME@mongodb-mongos:27017/datapulse?authSource=admin"
  
  # Database name
  DB_NAME: "datapulse_production"
  
  # Redis Connection String (for cluster)
  # Format: redis://user:pass@redis-cluster:6379/0
  REDIS_URL: "redis://:CHANGE_ME@redis-cluster:6379/0"
  
  # JWT Secret Key (generate with: openssl rand -hex 64)
  JWT_SECRET_KEY: "CHANGE_ME_GENERATE_SECURE_KEY_WITH_OPENSSL"
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRATION_HOURS: "24"
  
  # Emergent LLM Key for AI features
  EMERGENT_LLM_KEY: "sk-emergent-CHANGE_ME"
  
  # AWS Credentials (for S3 file storage)
  AWS_ACCESS_KEY_ID: "CHANGE_ME"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME"
  AWS_REGION: "us-east-1"
  AWS_S3_BUCKET: "datapulse-uploads-prod"
  
  # SendGrid for emails
  SENDGRID_API_KEY: "CHANGE_ME"
  
  # Sentry for error tracking
  SENTRY_DSN: "https://CHANGE_ME@sentry.io/project"
---
# TLS Certificate Secret (for HTTPS)
# In production, use cert-manager with Let's Encrypt
apiVersion: v1
kind: Secret
metadata:
  name: datapulse-tls
  namespace: datapulse
type: kubernetes.io/tls
data:
  # Base64 encoded certificate and key
  # Generate with: kubectl create secret tls datapulse-tls --cert=tls.crt --key=tls.key
  tls.crt: LS0tLS1CRUdJTi... # Placeholder
  tls.key: LS0tLS1CRUdJTi... # Placeholder
---
# Docker Registry Secret (for private images)
apiVersion: v1
kind: Secret
metadata:
  name: regcred
  namespace: datapulse
type: kubernetes.io/dockerconfigjson
data:
  # Generate with: kubectl create secret docker-registry regcred --docker-server=<registry> --docker-username=<user> --docker-password=<pass>
  .dockerconfigjson: eyJhdXRocyI6e319 # Placeholder
