# DataPulse Ingress - Entry point for all traffic
# Configured for nginx-ingress controller with SSL termination

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: datapulse-ingress
  namespace: datapulse
  labels:
    app: datapulse
  annotations:
    # Ingress class
    kubernetes.io/ingress.class: "nginx"
    
    # SSL/TLS
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    
    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "50"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    
    # Timeouts
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    
    # Compression
    nginx.ingress.kubernetes.io/enable-compression: "true"
    
    # CORS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://datapulse.io,https://app.datapulse.io"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"
    
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.datapulse.io wss://api.datapulse.io;" always;
    
    # Sticky sessions (if needed)
    # nginx.ingress.kubernetes.io/affinity: "cookie"
    # nginx.ingress.kubernetes.io/session-cookie-name: "datapulse-session"
    
    # WebSocket support
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/upstream-hash-by: "$request_uri"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - datapulse.io
    - app.datapulse.io
    - api.datapulse.io
    secretName: datapulse-tls
  rules:
  # Main application
  - host: app.datapulse.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: datapulse-frontend
            port:
              number: 80
  
  # API endpoint
  - host: api.datapulse.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: datapulse-backend
            port:
              number: 8001
  
  # Landing page / Marketing site
  - host: datapulse.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: datapulse-frontend
            port:
              number: 80
---
# Ingress for AWS ALB (alternative to nginx-ingress)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: datapulse-alb-ingress
  namespace: datapulse
  annotations:
    kubernetes.io/ingress.class: "alb"
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    alb.ingress.kubernetes.io/target-type: "ip"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:ACCOUNT:certificate/CERT_ID"
    alb.ingress.kubernetes.io/healthcheck-path: "/api/health"
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
    alb.ingress.kubernetes.io/target-group-attributes: "deregistration_delay.timeout_seconds=30,stickiness.enabled=false"
spec:
  ingressClassName: alb
  rules:
  - host: api.datapulse.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: datapulse-backend
            port:
              number: 8001
  - host: app.datapulse.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: datapulse-frontend
            port:
              number: 80
