# DataPulse Frontend Service
apiVersion: v1
kind: Service
metadata:
  name: datapulse-frontend
  namespace: datapulse
  labels:
    app: datapulse
    component: frontend
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
  selector:
    app: datapulse
    component: frontend
