# DataPulse CI/CD Pipeline
# Full pipeline: Build → Test → Staging → Production
#
# Triggers:
#   - Push to main/develop: Full pipeline
#   - Pull requests: Build & Test only
#   - Manual dispatch: Select environment
#
# Required Secrets:
#   - GHCR_TOKEN: GitHub Container Registry token (or use GITHUB_TOKEN)
#   - KUBE_CONFIG_STAGING: Base64 encoded kubeconfig for staging
#   - KUBE_CONFIG_PRODUCTION: Base64 encoded kubeconfig for production
#   - MONGO_URL_STAGING/PRODUCTION: MongoDB connection strings
#   - REDIS_URL_STAGING/PRODUCTION: Redis connection strings
#   - JWT_SECRET_KEY: JWT signing key
#   - STRIPE_API_KEY: Stripe API key
#   - EMERGENT_LLM_KEY: Emergent LLM key

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: 'Skip tests'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend
  HELM_VERSION: '3.13.0'
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  # ============================================================================
  # LINT & TYPE CHECK
  # ============================================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install Python dependencies
        run: |
          pip install ruff mypy
          pip install -r backend/requirements.txt

      - name: Lint Python (Backend)
        run: |
          ruff check backend/
          # mypy backend/ --ignore-missing-imports

      - name: Install Node dependencies
        run: |
          cd frontend
          yarn install --frozen-lockfile

      - name: Lint JavaScript (Frontend)
        run: |
          cd frontend
          yarn lint || true  # Don't fail on warnings

  # ============================================================================
  # TEST BACKEND
  # ============================================================================
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: lint
    if: ${{ !inputs.skip_tests }}
    
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run tests
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: test_database
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-key-for-ci
          EMERGENT_LLM_KEY: ${{ secrets.EMERGENT_LLM_KEY || 'test-key' }}
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY || 'sk_test_mock' }}
        run: |
          cd backend
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  # ============================================================================
  # TEST FRONTEND
  # ============================================================================
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    needs: lint
    if: ${{ !inputs.skip_tests }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: |
          cd frontend
          yarn install --frozen-lockfile

      - name: Run tests
        run: |
          cd frontend
          yarn test --coverage --watchAll=false || true

      - name: Build check
        env:
          REACT_APP_BACKEND_URL: https://api.example.com
        run: |
          cd frontend
          yarn build

  # ============================================================================
  # BUILD & PUSH IMAGES
  # ============================================================================
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: |
      always() && 
      (needs.test-backend.result == 'success' || needs.test-backend.result == 'skipped') &&
      (needs.test-frontend.result == 'success' || needs.test-frontend.result == 'skipped') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      backend_image: ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.version }}
      frontend_image: ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            REACT_APP_BACKEND_URL=${{ vars.BACKEND_URL || 'https://api.datapulse.io' }}

  # ============================================================================
  # DEPLOY TO STAGING
  # ============================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: |
      (github.ref == 'refs/heads/develop' || github.event.inputs.environment == 'staging') &&
      github.event_name != 'pull_request'
    environment:
      name: staging
      url: https://staging.datapulse.io
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy with Helm
        run: |
          helm upgrade --install datapulse ./infrastructure/helm/datapulse \
            --namespace datapulse-staging \
            --create-namespace \
            --values ./infrastructure/helm/datapulse/values.yaml \
            --set global.environment=staging \
            --set backend.image.tag=${{ needs.build.outputs.image_tag }} \
            --set frontend.image.tag=${{ needs.build.outputs.image_tag }} \
            --set backend.replicaCount=3 \
            --set frontend.replicaCount=2 \
            --set backend.autoscaling.minReplicas=3 \
            --set backend.autoscaling.maxReplicas=10 \
            --set backend.secrets.mongoUrl="${{ secrets.MONGO_URL_STAGING }}" \
            --set backend.secrets.redisUrl="${{ secrets.REDIS_URL_STAGING }}" \
            --set backend.secrets.jwtSecretKey="${{ secrets.JWT_SECRET_KEY }}" \
            --set backend.secrets.stripeApiKey="${{ secrets.STRIPE_API_KEY }}" \
            --set backend.secrets.emergentLlmKey="${{ secrets.EMERGENT_LLM_KEY }}" \
            --wait \
            --timeout 10m

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/datapulse-backend -n datapulse-staging --timeout=300s
          kubectl rollout status deployment/datapulse-frontend -n datapulse-staging --timeout=300s

      - name: Run smoke tests
        run: |
          STAGING_URL="${{ vars.STAGING_URL || 'https://staging.datapulse.io' }}"
          
          # Wait for service to be ready
          sleep 30
          
          # Health check
          curl -f "$STAGING_URL/api/health" || exit 1
          
          # API check
          curl -f "$STAGING_URL/api/" || exit 1
          
          echo "Smoke tests passed!"

  # ============================================================================
  # DEPLOY TO PRODUCTION
  # ============================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, deploy-staging]
    if: |
      (github.ref == 'refs/heads/main' || github.event.inputs.environment == 'production') &&
      github.event_name != 'pull_request'
    environment:
      name: production
      url: https://app.datapulse.io
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy with Helm
        run: |
          helm upgrade --install datapulse ./infrastructure/helm/datapulse \
            --namespace datapulse \
            --create-namespace \
            --values ./infrastructure/helm/datapulse/values.yaml \
            --set global.environment=production \
            --set backend.image.tag=${{ needs.build.outputs.image_tag }} \
            --set frontend.image.tag=${{ needs.build.outputs.image_tag }} \
            --set backend.replicaCount=20 \
            --set frontend.replicaCount=5 \
            --set backend.autoscaling.minReplicas=20 \
            --set backend.autoscaling.maxReplicas=100 \
            --set backend.secrets.mongoUrl="${{ secrets.MONGO_URL_PRODUCTION }}" \
            --set backend.secrets.redisUrl="${{ secrets.REDIS_URL_PRODUCTION }}" \
            --set backend.secrets.jwtSecretKey="${{ secrets.JWT_SECRET_KEY }}" \
            --set backend.secrets.stripeApiKey="${{ secrets.STRIPE_API_KEY }}" \
            --set backend.secrets.emergentLlmKey="${{ secrets.EMERGENT_LLM_KEY }}" \
            --wait \
            --timeout 15m

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/datapulse-backend -n datapulse --timeout=600s
          kubectl rollout status deployment/datapulse-frontend -n datapulse --timeout=300s

      - name: Run smoke tests
        run: |
          PROD_URL="${{ vars.PRODUCTION_URL || 'https://app.datapulse.io' }}"
          
          # Wait for service to be ready
          sleep 30
          
          # Health check
          curl -f "$PROD_URL/api/health" || exit 1
          
          # API check
          curl -f "$PROD_URL/api/" || exit 1
          
          echo "Production smoke tests passed!"

      - name: Notify on success
        if: success()
        run: |
          echo "🚀 Production deployment successful!"
          echo "Version: ${{ needs.build.outputs.image_tag }}"
          echo "URL: https://app.datapulse.io"

  # ============================================================================
  # ROLLBACK (Manual)
  # ============================================================================
  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && failure()
    needs: [deploy-staging, deploy-production]
    
    steps:
      - name: Rollback Helm release
        run: |
          ENV="${{ inputs.environment }}"
          NAMESPACE="datapulse"
          [[ "$ENV" == "staging" ]] && NAMESPACE="datapulse-staging"
          
          helm rollback datapulse -n $NAMESPACE
          
          echo "Rolled back to previous version"
